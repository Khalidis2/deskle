<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact — Deskle</title>
<meta name="description" content="Get in touch about Deskle — bugs, suggestions, or anything else.">
<meta name="theme-color" content="#1B2430">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%E2%8F%B0%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1B2430; --ink-2: #242E3D; --paper: #F4EDE0; --paper-dim: #C9C2B3;
    --yellow: #D9A441; --slate: #3A4453;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font-family: 'Courier New', ui-monospace, monospace;
    padding: calc(32px + env(safe-area-inset-top)) 20px 60px;
    max-width: 720px; margin-left: auto; margin-right: auto;
    line-height: 1.7;
  }
  a { color: var(--yellow); }
  .back-link { display: inline-block; margin-bottom: 24px; color: var(--paper-dim); text-decoration: none; font-size: 13px; }
  .back-link:hover { color: var(--yellow); }
  h1 { font-family: Georgia, serif; font-weight: 900; text-transform: uppercase; font-size: 32px; margin-bottom: 24px; }
  p { font-size: 14px; color: var(--paper-dim); }
  .email-box {
    display: inline-block;
    border: 1px solid var(--slate);
    border-radius: 4px;
    padding: 14px 22px;
    margin-top: 16px;
    font-size: 16px;
    color: var(--yellow);
  }
</style>
</head>
<body>
  <a class="back-link" href="/">← back to Deskle</a>
  <h1>Contact</h1>
  <p>Found a bug, have a suggestion for a word, or just want to say something? Reach out directly:</p>
  <div class="email-box"><a href="mailto:p.pzq12@gmail.com">p.pzq12@gmail.com</a></div>
</body>
</html>
